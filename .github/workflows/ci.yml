name: CI

on:
  push:
    branches: [master, redesign]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm run verify
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.16.x autorun
      # Exercise the with-analytics branch too (the key is a dummy; nothing is sent from CI).
      - name: Build + verify with an analytics key
        run: npm run build && npm run verify
        env:
          PUBLIC_POSTHOG_KEY: phc_ci_test
